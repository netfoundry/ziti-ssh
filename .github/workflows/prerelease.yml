name: Prerelease

on:
  push:
    tags:
      - 'v*.*.*'

env:
  NF_DEB_TEST_REPO: ${{ vars.NF_DEB_TEST_REPO || 'nfpax-netfoundry-deb-test' }}
  NF_RPM_TEST_REPO: ${{ vars.NF_RPM_TEST_REPO || 'nfpax-netfoundry-rpm-test' }}
  JFROG_CLI_VERSION: ${{ vars.JFROG_CLI_VERSION || '2.133.0' }}
  NFPM_VERSION: ${{ vars.NFPM_VERSION || '2.49.0' }}

jobs:
  build_and_publish:
    name: Build & Publish Packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install nfpm
        run: |
          set -euo pipefail
          tarball="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          base="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}"
          tmp="$(mktemp -d)"
          curl -sfL -o "${tmp}/${tarball}" "${base}/${tarball}"
          curl -sfL -o "${tmp}/checksums.txt" "${base}/checksums.txt"
          (cd "${tmp}" && grep " ${tarball}\$" checksums.txt | sha256sum -c -)
          tar -xzf "${tmp}/${tarball}" -C /usr/local/bin nfpm
          nfpm --version

      - name: Configure jFrog CLI
        uses: jfrog/setup-jfrog-cli@4c2f06da03095113100534a16d58d8a252680949 # v5.3.5
        with:
          version: ${{ env.JFROG_CLI_VERSION }}
          oidc-provider-name: nf-github-actions-setup-jfrog-cli
        env:
          JF_URL: https://netfoundry.jfrog.io

      - name: Build packages
        run: |
          VERSION=${GITHUB_REF_NAME#v} ARCHS=amd64,arm64 ./scripts/build-packages.sh

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- *.deb *.rpm > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.deb
            dist/*.rpm

      - name: Upload DEBs to test repo
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          for pkg in ziti-ssh ziti-scp ziti-ssh-ca ziti-ssh-host; do
            for arch in amd64 arm64; do
              jf rt upload \
                --flat=true \
                --recursive=false \
                --deb "debian/main/${arch}" \
                "dist/${pkg}_${VERSION}-1_${arch}.deb" \
                "${NF_DEB_TEST_REPO}/pool/${pkg}/${arch}/"
            done
          done

      - name: Upload RPMs to test repo
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          declare -A RPM_ARCH=([amd64]=x86_64 [arm64]=aarch64)
          for pkg in ziti-ssh ziti-scp ziti-ssh-ca ziti-ssh-host; do
            for arch in amd64 arm64; do
              jf rt upload \
                --flat=true \
                --recursive=false \
                "dist/${pkg}-${VERSION}-1.${RPM_ARCH[$arch]}.rpm" \
                "${NF_RPM_TEST_REPO}/redhat/${RPM_ARCH[$arch]}/"
            done
          done

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          prerelease: true
          files: dist/SHA256SUMS
