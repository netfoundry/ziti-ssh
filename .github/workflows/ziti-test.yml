name: Integration Test

# Builds .deb packages from HEAD, provisions a real Ziti network on AWS,
# stages the packages onto each VM, and runs end-to-end connectivity tests.
#
# Prerequisites (one-time setup):
#   AWS_ROLE_ARN   — OIDC IAM role for AWS credential federation
#                    (see ziti-test-suite/docs/setup/aws-oidc.md)
#   ZTS_CHECKOUT_TOKEN — fine-grained PAT with read access to
#                        netfoundry/ziti-test-suite
#
# The topology is defined in suites/ziti-ssh/suite.yml:
#   • 1 Ziti controller  — runs ziti-ssh-ca
#   • 2 edge routers     — each runs ziti-ssh-host (proxies Ziti → local sshd)
#   • 1 client VM        — runs ziti-ssh and ziti-scp

on:
  workflow_dispatch:
    inputs:
      keep_on_failure:
        description: 'Leave infra running if tests fail (for SSH debugging)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# Least privilege by default; jobs below widen only what they need.
permissions:
  contents: read

jobs:
  build-debs:
    name: Build Debian Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build .deb packages
        run: VERSION=0.0.0 FORMAT=deb ARCHS=amd64 ./scripts/build-packages.sh

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ziti-ssh-debs
          path: dist/*.deb
          retention-days: 1

  integration-test:
    name: Integration Test
    needs: build-debs
    # The reusable workflow and the suite code it checks out are pinned to the
    # same commit (ziti-test-suite main, 2026-04-24). ziti-test-suite is private:
    # bump both SHAs together by hand unless Dependabot has been granted access.
    # id-token: write is the maximum the called workflow requests (AWS OIDC).
    permissions:
      contents: read
      id-token: write
    uses: netfoundry/ziti-test-suite/.github/workflows/ziti-network.yml@fdba452ba30e016a7cc8bbb051784606efe35c55 # main 2026-04-24
    with:
      topology_file: suites/ziti-ssh/suite.yml
      ziti_test_suite_ref: fdba452ba30e016a7cc8bbb051784606efe35c55
      artifacts: ziti-ssh-debs
      keep_on_failure: ${{ inputs.keep_on_failure || 'false' }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      ZTS_CHECKOUT_TOKEN: ${{ secrets.ZTS_CHECKOUT_TOKEN }}
